<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bom Jesus Financeiro v1.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira+Condensed:ital,wght@0,600;0,700;1,700;1,800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --preto:#000;--grafite:#25272b;--amarelo:#F2B200;--laranja:#E2601A;--cinza:#9EA1A6;
  --fundo:#E4E6E9;--papel:#fff;--texto:#1d1f22;--suave:#5c6168;--linha:#d3d6da;
  --verde:#1E7F46;--vermelho:#B3261E;
  --titulo:'Saira Condensed','Arial Narrow',Arial,sans-serif;
  --corpo:'Barlow','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--corpo);font-size:15px;color:var(--texto);background:var(--fundo);line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}

/* barra lateral */
.lateral{background:var(--preto);color:#cfd1d4;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.lateral .logo{padding:18px 16px 14px}
.lateral .logo img{width:100%;display:block}
.faixa-obra{height:10px;background:repeating-linear-gradient(-45deg,var(--amarelo) 0 12px,var(--preto) 12px 24px)}
.nav{display:flex;flex-direction:column;padding:14px 0;gap:2px}
.nav button{background:none;border:0;text-align:left;padding:11px 20px;color:#b9bcc0;cursor:pointer;font-weight:500;border-left:4px solid transparent}
.nav button:hover{color:#fff;background:#111}
.nav button.ativo{color:#fff;border-left-color:var(--amarelo);background:#141414}
.lateral .rodape{margin-top:auto;padding:14px 20px;font-size:12px;color:#8a8d92}
.status{display:inline-flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--cinza);display:inline-block}
.status.online i{background:#3fbf6f}.status.erro i{background:#e5533d}.status.salvando i{background:var(--amarelo)}

/* conteúdo */
main{padding:26px 30px 60px;min-width:0}
.topo{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-family:var(--titulo);font-style:italic;font-weight:800;font-size:38px;line-height:1;margin:0}
h2{font-family:var(--titulo);font-weight:700;font-size:20px;margin:0 0 12px}
.sub{margin:4px 0 0;color:var(--suave)}
.acoes{display:flex;gap:8px;flex-wrap:wrap}

.btn{background:var(--amarelo);color:#000;border:0;padding:9px 16px;font-weight:700;cursor:pointer;border-radius:3px}
.btn:hover{filter:brightness(.95)}
.btn-saida{background:var(--laranja);color:#fff}
.btn-sec{background:#fff;border:1px solid var(--linha);font-weight:600}
.btn-perigo{background:#fff;color:var(--vermelho);border:1px solid #e3b4b0;font-weight:600}
.btn-p{padding:5px 10px;font-size:13px}
.link{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-weight:600;padding:0}
:focus-visible{outline:3px solid var(--amarelo);outline-offset:2px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));background:var(--papel);border-top:4px solid var(--preto);margin-bottom:18px}
.kpis div{padding:14px 18px;border-left:1px solid var(--linha)}
.kpis div:first-child{border-left:0}
.kpis span{display:block;color:var(--suave);font-size:13px}
.kpis b{font-family:var(--titulo);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}
.pos{color:var(--verde)}.neg{color:var(--laranja)}

.bloco{background:var(--papel);padding:18px;margin-bottom:18px}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grade2 .bloco{margin-bottom:0}
.grade2+.grade2,.grade2+.bloco{margin-top:18px}
.gr{position:relative;height:260px}
.vazio{color:var(--suave);margin:8px 0}

.alerta{padding:12px 16px;margin-bottom:18px;background:#fff6dc;border-left:10px solid transparent;border-image:repeating-linear-gradient(-45deg,var(--amarelo) 0 8px,var(--preto) 8px 16px) 10}

.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--papel);padding:14px 16px;margin-bottom:14px}
.filtros label{display:flex;flex-direction:column;font-size:12px;color:var(--suave);gap:3px}
.filtros input,.filtros select{padding:7px 8px;border:1px solid var(--linha);border-radius:3px;background:#fff;min-width:130px;color:var(--texto);font-size:14px}

.tab-wrap{overflow-x:auto;background:var(--papel)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;color:var(--suave);font-weight:600;padding:10px 12px;border-bottom:2px solid var(--preto);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--linha);vertical-align:middle}
tr:hover td{background:#fafafa}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.acoes-l{white-space:nowrap;text-align:right}
tfoot td{font-weight:700;border-top:2px solid var(--preto);border-bottom:0}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:2px;background:#eceef0;color:#3a3d42;font-weight:600;white-space:nowrap}
.tag.nota{background:var(--grafite);color:#fff}
.tag.recibo{background:#ffe9a6;color:#5b4300}
.tag.vencida{background:#fbe1dc;color:var(--vermelho)}
.tag.paga{background:#dcefe3;color:var(--verde)}
.ic{background:none;border:0;cursor:pointer;padding:4px 6px;color:var(--suave);font-weight:600;font-size:13px}
.ic:hover{color:var(--texto);text-decoration:underline}
.ic.del:hover{color:var(--vermelho)}

.duo{display:flex;gap:24px;margin-bottom:12px}
.duo span{display:block;font-size:13px;color:var(--suave)}
.duo b{font-family:var(--titulo);font-size:26px}
.prop{display:flex;height:14px;background:#eceef0}
.prop i{display:block;height:100%}

/* contratos */
.contrato{background:var(--papel);padding:16px 18px;margin-bottom:10px;display:grid;grid-template-columns:1fr 220px auto;gap:18px;align-items:center;border-left:6px solid var(--grafite)}
.contrato.quitado{border-left-color:var(--verde);opacity:.8}
.contrato h3{margin:4px 0 2px;font-family:var(--titulo);font-size:22px}
.contrato .meta{color:var(--suave);font-size:13px}
.barra{height:10px;background:#eceef0;margin:6px 0}
.barra i{display:block;height:100%;background:var(--amarelo)}
.abas{display:flex;gap:0;margin-bottom:14px;flex-wrap:wrap}
.abas button{background:#fff;border:1px solid var(--linha);padding:7px 14px;cursor:pointer;font-weight:600;margin-right:-1px}
.abas button.ativo{background:var(--preto);color:#fff;border-color:var(--preto)}

/* modal */
.fundo-modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;padding:40px 14px;z-index:50;overflow-y:auto}
.fundo-modal.aberto{display:flex}
.modal{background:#fff;width:100%;max-width:560px;border-top:6px solid var(--amarelo)}
.modal header{padding:16px 20px 4px}
.modal header h2{margin:0;font-size:24px;font-style:italic}
.modal .corpo{padding:12px 20px}
.modal footer{padding:12px 20px 18px;display:flex;justify-content:flex-end;gap:8px}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.campos .inteiro{grid-column:1/-1}
.campos label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--suave);font-weight:500}
.campos input,.campos select,.campos textarea{padding:8px 9px;border:1px solid var(--linha);border-radius:3px;font-size:15px;color:var(--texto);background:#fff}
.campos .check{flex-direction:row;align-items:center;gap:8px;color:var(--texto)}
.seg{display:flex}
.seg label{position:relative;flex:1;flex-direction:row;justify-content:center;border:1px solid var(--linha);padding:9px;cursor:pointer;color:var(--texto);font-weight:600;margin-right:-1px}
.seg input{position:absolute;opacity:0}
.seg label:has(input:checked){background:var(--preto);color:#fff;border-color:var(--preto)}
.seg label.ent:has(input:checked){background:var(--verde);border-color:var(--verde)}
.seg label.sai:has(input:checked){background:var(--laranja);border-color:var(--laranja)}
.dica{font-size:13px;color:var(--suave);margin:4px 0 0}
pre.sql{background:#16171a;color:#e9e9e9;padding:12px;overflow-x:auto;font-size:12.5px}

.toast{position:fixed;right:18px;bottom:18px;background:var(--preto);color:#fff;padding:11px 16px;border-left:5px solid var(--amarelo);z-index:60;max-width:360px;display:none}
.toast.erro{border-left-color:#e5533d}
.cab-print{display:none}

.fundo-modal.m2{z-index:55;background:rgba(0,0,0,.4)}
.campo-icone{display:flex;gap:6px}
.campo-icone input{flex:1;min-width:0}
.btn-ic{background:var(--preto);color:var(--amarelo);border:0;border-radius:3px;width:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.btn-ic:hover{background:var(--grafite)}
.top10 td{padding:7px 8px}
.modal.largo{max-width:920px}
.rot{display:block;font-size:13px;color:var(--suave);font-weight:500;margin-bottom:4px}
.seg4 label{font-size:14px;padding:8px 4px}
.linha-parc{display:grid;grid-template-columns:56px 1fr 1fr;gap:8px;align-items:center;margin-top:6px}
.linha-parc input{padding:7px 8px;border:1px solid var(--linha);border-radius:3px;font-size:15px}
.itens-orc td{padding:5px 4px;vertical-align:top}
.itens-orc input,.itens-orc select{width:100%;padding:7px;border:1px solid var(--linha);border-radius:3px;font-size:14px;background:#fff}
.total-orc{display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;color:var(--suave);font-size:13px}
.total-orc b{font-family:var(--titulo);font-size:30px;color:var(--texto)}
.top10 .pos{color:var(--suave);font-family:var(--titulo);font-weight:700;width:28px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .lateral{position:static;height:auto}
  .lateral .logo{padding:12px 14px 10px;max-width:280px}
  .nav{flex-direction:row;overflow-x:auto;padding:0}
  .nav button{border-left:0;border-bottom:4px solid transparent;white-space:nowrap;padding:12px 14px}
  .nav button.ativo{border-bottom-color:var(--amarelo)}
  .lateral .rodape{display:none}
  main{padding:18px 14px 60px}
  .grade2{grid-template-columns:1fr}
  .contrato{grid-template-columns:1fr}
  .campos{grid-template-columns:1fr}
  h1{font-size:32px}
}
@media print{
  body{background:#fff}
  .lateral,.filtros,.acoes,.nao-imprimir,.ic,td.acoes-l,th.acoes-l{display:none!important}
  .app{display:block}
  main{padding:0}
  .bloco,.tab-wrap{padding:0}
  .cab-print{display:flex;justify-content:space-between;align-items:center;background:#000;padding:10px 14px;margin-bottom:14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cab-print img{height:44px}
  .cab-print span{color:#fff;font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ================== CONSTANTES ================== */
const CHAVE='bjt_financeiro_v1', CHAVE_CFG='bjt_financeiro_cfg', REG_ID='bom_jesus_financeiro';
const FORMAS=['Dinheiro','PIX','Transferência','Boleto','Cartão de débito','Cartão de crédito','Cheque'];
const TIPOS_CONTRATO={financiamento:'Financiamento',emprestimo:'Empréstimo',consorcio:'Consórcio'};
const CAT_PARCELA={financiamento:'Parcela de financiamento',emprestimo:'Parcela de empréstimo',consorcio:'Parcela de consórcio'};
const CORES=['#25272b','#F2B200','#E2601A','#6b7078','#c98a00','#9EA1A6','#8c3a0e','#3d6b8a','#1E7F46','#b8bcc2','#5b4300','#d9a07a'];

/* ================== ESTADO ================== */
let D=null, CFG={}, tela='painel', graficos=[], modalOk=null, contratoAberto=null;
let FC={de:'',ate:'',tipo:'',cat:'',forma:'',centro:'',busca:''};
let FP={de:'',ate:'',doc:'',status:'',cat:'',busca:''};
let FK={tipo:'',quitados:false};
let FR={tipo:'categorias',de:'',ate:''};
let FA={de:'',ate:'',forn:'',status:'aberto'};
let FRc={de:'',ate:'',cli:'',status:'aberto',centro:''};
let FO={status:'',busca:'',de:'',ate:''};
let abaCad='saida';

/* ================== UTILITÁRIOS ================== */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const r2=v=>Math.round((+v||0)*100)/100;
function parseValor(s){
  if(typeof s==='number')return r2(s);
  s=String(s||'').trim().replace(/[R$\s]/g,'');
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  const n=parseFloat(s);return isNaN(n)?0:r2(n);
}
const fmtISO=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hoje=()=>fmtISO(new Date());
const dBR=s=>s?s.split('-').reverse().join('/'):'';
const iniMes=()=>hoje().slice(0,8)+'01';
const fimMes=()=>{const d=new Date();return fmtISO(new Date(d.getFullYear(),d.getMonth()+1,0));};
function addMeses(iso,n){const [y,m,d]=iso.split('-').map(Number);const t=new Date(y,m-1+n,1);const ult=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d,ult));return fmtISO(t);}
function addDias(iso,n){const [y,m,d]=iso.split('-').map(Number);return fmtISO(new Date(y,m-1,d+n));}
const mesNome=k=>{const [y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}).replace('.','');};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const soma=(arr,f='valor')=>r2(arr.reduce((a,x)=>a+(+x[f]||0),0));
const cat=id=>D.categorias.find(c=>c.id===id);
const catNome=id=>cat(id)?.nome||'Sem categoria';
const centroNome=id=>D.centros.find(c=>c.id===id)?.nome||'';
function catPorNome(nome,tipo){let c=D.categorias.find(x=>x.nome===nome&&x.tipo===tipo);if(!c){c={id:uid(),nome,tipo};D.categorias.push(c);}return c.id;}
function ultimos12(){const out=[];const d=new Date();for(let i=11;i>=0;i--){const t=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(fmtISO(t).slice(0,7));}return out;}
function mesesEntre(de,ate){const out=[];let k=de.slice(0,7);while(k<=ate.slice(0,7)){out.push(k);k=addMeses(k+'-01',1).slice(0,7);if(out.length>120)break;}return out;}

function toast(msg,tipo){const t=$('#toast');t.textContent=msg;t.className='toast'+(tipo==='erro'?' erro':'');t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500);}
function kpis(lista){return '<div class="kpis">'+lista.map(([l,v,c])=>`<div><span>${l}</span><b class="${c||''}">${v}</b></div>`).join('')+'</div>';}
function opcoes(lista,sel,vazio){return (vazio!==undefined?`<option value="">${vazio}</option>`:'')+lista.map(o=>{const v=typeof o==='string'?o:o.id,t=typeof o==='string'?o:o.nome;return `<option value="${esc(v)}"${v===sel?' selected':''}>${esc(t)}</option>`;}).join('');}
const catsTipo=t=>D.categorias.filter(c=>!t||c.tipo===t).sort((a,b)=>a.nome.localeCompare(b.nome));
const centrosAtivos=()=>D.centros.filter(c=>c.ativo!==false).sort((a,b)=>a.nome.localeCompare(b.nome));

/* ================== DADOS / ARMAZENAMENTO ================== */
function base(){
  const cats=[];
  ['Serviços de terraplanagem','Locação de máquinas','Venda de terra, areia ou pedra','Aporte dos sócios','Empréstimo recebido','Outras entradas'].forEach(n=>cats.push({id:uid(),nome:n,tipo:'entrada'}));
  ['Diesel e combustível','Manutenção de máquinas','Peças e pneus','Frete de máquinas (prancha)','Compras de materiais','Salários e encargos','Pró-labore','Impostos (DAS)','Alimentação da equipe','Aluguel','Energia, água e telefone','Contabilidade','Seguros','Parcela de financiamento','Parcela de empréstimo','Parcela de consórcio','Retirada dos sócios','Tarifas bancárias','Outras despesas'].forEach(n=>cats.push({id:uid(),nome:n,tipo:'saida'}));
  return {versao:1,empresa:'Bom Jesus Terraplanagem',saldoInicial:0,dataSaldoInicial:hoje(),categorias:cats,centros:[{id:uid(),nome:'Geral / escritório',tipo:'geral',ativo:true}],lancamentos:[],compras:[],contratos:[],fornecedores:[],receber:[],clientes:[],recorrentes:[],orcamentos:[],seqOrc:0,empresaDados:{}};
}
function normalizar(){['categorias','centros','lancamentos','compras','contratos','fornecedores','receber','clientes','recorrentes','orcamentos'].forEach(k=>{if(!Array.isArray(D[k]))D[k]=[];});}
const online=()=>!!(CFG.url&&CFG.chave);
const hdr=()=>CFG.chave.startsWith('sb_')?{apikey:CFG.chave,'Content-Type':'application/json'}:{apikey:CFG.chave,Authorization:'Bearer '+CFG.chave,'Content-Type':'application/json'};
function setStatus(s){const el=$('#status');el.className='status '+s;el.querySelector('span').textContent={local:'Dados neste aparelho',online:'Conectado ao Supabase',erro:'Sem conexão com o Supabase',salvando:'Salvando…'}[s];}
async function carregar(){
  try{CFG=JSON.parse(localStorage.getItem(CHAVE_CFG))||{};}catch(e){CFG={};}
  try{D=JSON.parse(localStorage.getItem(CHAVE));}catch(e){D=null;}
  if(online()){
    try{
      const r=await fetch(`${CFG.url}/rest/v1/dados_app?id=eq.${REG_ID}&select=dados`,{headers:hdr()});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();
      if(j[0]&&j[0].dados)D=j[0].dados;
      setStatus('online');
    }catch(e){setStatus('erro');toast('Não foi possível conectar ao Supabase. Usando os dados salvos neste computador.','erro');}
  }else setStatus('local');
  if(!D)D=base();
  normalizar();
}
let tSalvar;
function salvar(){
  localStorage.setItem(CHAVE,JSON.stringify(D));
  if(online()){clearTimeout(tSalvar);setStatus('salvando');tSalvar=setTimeout(enviar,700);}
}
async function enviar(){
  try{
    const r=await fetch(`${CFG.url}/rest/v1/dados_app?on_conflict=id`,{method:'POST',headers:{...hdr(),Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:REG_ID,dados:D,atualizado_em:new Date().toISOString()})});
    if(!r.ok)throw new Error(await r.text());
    setStatus('online');
  }catch(e){setStatus('erro');toast('Erro ao salvar online. Os dados ficaram salvos neste computador.','erro');}
}

/* ================== NAVEGAÇÃO / MODAL ================== */
function ir(t){tela=t;if(t!=='contratos')contratoAberto=null;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('ativo',b.dataset.t===t));render();window.scrollTo(0,0);}
function render(){
  graficos.forEach(g=>g.destroy());graficos=[];
  const m=$('#conteudo');

/* máscara de valor: digita só números e o app coloca ponto e vírgula */
function mascaraValor(el){
  const neg=el.dataset.neg!==undefined&&el.value.trim().startsWith('-');
  const d=el.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'');
  if(!d){el.value=neg?'-':'';return;}
  el.value=(neg?'-':'')+num(parseInt(d,10)/100);
}

function agrupar(lista,fn,campo='valor'){const o={};lista.forEach(x=>{const k=fn(x);o[k]=r2((o[k]||0)+(+x[campo]||0));});return Object.entries(o).sort((a,b)=>b[1]-a[1]);}

function modalLanc(id,tipoPadrao){
  const l=id?D.lancamentos.find(x=>x.id===id):{tipo:tipoPadrao||'saida',data:hoje(),valor:'',categoriaId:'',descricao:'',forma:'PIX',centroId:'',obs:''};

  if(l.origem==='receber'){toast('Este lançamento veio de Contas a receber. Altere por lá.');return;}
  if(l.origem==='compra'){toast('Este lançamento veio de uma compra. Altere pela tela Compras.');return;}
  if(l.origem==='parcela'||l.origem==='contrato'){toast('Este lançamento veio de um financiamento ou empréstimo. Altere pela tela Financiamentos.');return;}
  abrirModal(id?'Editar lançamento':(l.tipo==='entrada'?'Nova entrada':'Nova saída'),`
  <div class="campos">

    <label>Data<input type="date" id="l-data" value="${l.data}"></label>
    <label>Valor (R$)<input id="l-valor" inputmode="decimal" placeholder="0,00" value="${l.valor?num(l.valor):''}"></label>
    <label class="inteiro">Descrição<input id="l-desc" value="${esc(l.descricao)}" placeholder="Ex.: Serviço de corte e aterro, obra Jd. Primavera"></label>
    <label>Categoria<select id="l-cat">${opcoes(catsTipo(l.tipo),l.categoriaId)}</select></label>
    <label>Forma<select id="l-forma">${opcoes(FORMAS,l.forma)}</select></label>
    <label class="inteiro">Obra / máquina (opcional)<select id="l-centro">${opcoes(centrosAtivos(),l.centroId,'Nenhuma')}</select></label>
    <label class="inteiro">Observação<textarea id="l-obs" rows="2">${esc(l.obs||'')}</textarea></label>
  </div>`,()=>{
    const tipo=document.querySelector('input[name=ltipo]:checked').value;
    const dados={tipo,data:val('l-data'),valor:parseValor(val('l-valor')),descricao:val('l-desc'),categoriaId:val('l-cat'),forma:val('l-forma'),centroId:val('l-centro'),obs:val('l-obs')};
    if(!dados.data){toast('Informe a data.','erro');return false;}
    if(dados.valor<=0){toast('Informe um valor maior que zero.','erro');return false;}
    if(!dados.categoriaId){toast('Escolha a categoria.','erro');return false;}
    if(!dados.descricao)dados.descricao=catNome(dados.categoriaId);
    if(id)Object.assign(l,dados);else D.lancamentos.push({id:uid(),origem:'manual',...dados});
    salvar();render();toast(id?'Lançamento alterado.':'Lançamento salvo.');
  });
}
function trocarTipoLanc(){const t=document.querySelector('input[name=ltipo]:checked').value;$('#l-cat').innerHTML=opcoes(catsTipo(t),'');}
function excluirLanc(id){
  const l=D.lancamentos.find(x=>x.id===id);if(!l)return;
  if(l.origem==='receber'){toast('Este lançamento veio de Contas a receber. Use Desfazer recebimento por lá.');return;}
  if(l.origem==='compra'){toast('Este lançamento veio de uma compra. Exclua ou altere pela tela Compras.');return;}
  if(l.origem==='parcela'){toast('Para desfazer, use Estornar na parcela, na tela Financiamentos.');return;}
  if(l.origem==='contrato'){toast('Este lançamento veio de um contrato (entrada ou valor recebido). Altere pela tela Financiamentos.');return;}
  if(!confirm(`Excluir o lançamento "${l.descricao}" de ${brl(l.valor)}?`))return;
  D.lancamentos=D.lancamentos.filter(x=>x.id!==id);salvar();render();toast('Lançamento excluído.');
}

}

function gradeParcHtml(px,tot,venc){return `<div class="inteiro">
  <div class="campos" style="grid-template-columns:repeat(3,1fr) auto;align-items:end">
    <label>Nº de parcelas<input type="number" id="${px}-gn" min="2" max="60" value="2"></label>

    <button type="button" class="btn btn-sec" onclick="gerarGrade('${px}','${tot}')">Gerar parcelas</button>
  </div><div id="${px}-gl"></div><p class="dica" id="${px}-gt">Informe o valor total, clique em Gerar parcelas e depois ajuste as datas e os valores, se precisar.</p></div>`;}
function gerarGrade(px,tot){
  const total=parseValor(val(tot));if(total<=0){toast('Informe primeiro o valor total.','erro');return;}
  const n=Math.max(2,Math.min(60,parseInt(val(px+'-gn'))||2)),v0=val(px+'-gv')||hoje(),it=val(px+'-gi');
  const base=r2(Math.floor(total/n*100)/100);let h='';
  for(let i=0;i<n;i++){const v=i===n-1?r2(total-base*(n-1)):base;const d=it==='m'?addMeses(v0,i):addDias(v0,i*(+it));
    h+=`<div class="linha-parc"><b>${i+1}/${n}</b><input type="date" class="gp-v" value="${d}" aria-label="Vencimento da parcela ${i+1}"><input class="gp-val" inputmode="decimal" value="${num(v)}" aria-label="Valor da parcela ${i+1}" oninput="setTimeout(()=>somaGrade('${px}','${tot}'))"></div>`;}
  $('#'+px+'-gl').innerHTML=h;somaGrade(px,tot);
}
function lerGrade(px){return [...document.querySelectorAll('#'+px+'-gl .linha-parc')].map(l=>({venc:l.querySelector('.gp-v').value,valor:parseValor(l.querySelector('.gp-val').value)}));}
function somaGrade(px,tot){const s=soma(lerGrade(px)),t=parseValor(val(tot)),d=r2(t-s);$('#'+px+'-gt').innerHTML=`Soma das parcelas: <b>${brl(s)}</b> de ${brl(t)}.`+(Math.abs(d)>=0.01?` <span class="neg">Diferença de ${brl(d)}.</span>`:' Confere com o total.');}
function validarGrade(px,total){
  const rows=lerGrade(px);
  if(rows.length<2){toast('Clique em Gerar parcelas.','erro');return null;}
  if(rows.some(r=>!r.venc||r.valor<=0)){toast('Todas as parcelas precisam de data e valor.','erro');return null;}
  const s=soma(rows);if(Math.abs(r2(s-total))>=0.01){toast(`A soma das parcelas (${brl(s)}) é diferente do valor total (${brl(total)}).`,'erro');return null;}
  return rows;
}

function filtrarCompras(){
  const b=FP.busca.toLowerCase();
  return D.compras.filter(c=>(!FP.de||c.data>=FP.de)&&(!FP.ate||c.data<=FP.ate)&&(!FP.doc||c.doc===FP.doc)&&(!FP.cat||c.categoriaId===FP.cat)&&(!FP.status||(FP.status==='pago'?c.pago:!c.pago))&&(!b||(c.fornecedor||'').toLowerCase().includes(b)||(c.descricao||'').toLowerCase().includes(b)||(c.numero||'').toLowerCase().includes(b)))
    .sort((a,b2)=>b2.data.localeCompare(a.data));
}
function telaCompras(m){
  if(!FP.de){FP.de=iniMes();FP.ate=fimMes();}
  const lista=filtrarCompras();
  const tn=soma(lista.filter(c=>c.doc==='nota')),tr=soma(lista.filter(c=>c.doc==='recibo')),tap=soma(lista.filter(c=>!c.pago));
  m.innerHTML=`<div class="cab-print"><img src="${$('.logo img').src}" alt=""><span>Compras de ${dBR(FP.de)} a ${dBR(FP.ate)}</span></div>
  <div class="topo"><div><h1>Compras</h1><p class="sub">Mercadorias, peças e materiais comprados com nota fiscal ou recibo</p></div>
  <div class="acoes"><button class="btn" onclick="modalCompra()">+ Nova compra</button><button class="btn btn-sec" onclick="window.print()">Imprimir</button><button class="btn btn-sec" onclick="exportarCompras()">Exportar Excel</button></div></div>
  <div class="filtros">
    <label>De<input type="date" value="${FP.de}" onchange="FP.de=this.value;render()"></label>
    <label>Até<input type="date" value="${FP.ate}" onchange="FP.ate=this.value;render()"></label>
    <label>Documento<select onchange="FP.doc=this.value;render()">${opcoes([{id:'nota',nome:'Nota fiscal'},{id:'recibo',nome:'Recibo'},{id:'outro',nome:'Outro (boleto, fatura)'}],FP.doc,'Todos')}</select></label>
    <label>Situação<select onchange="FP.status=this.value;render()">${opcoes([{id:'pago',nome:'Pagas'},{id:'aberto',nome:'A pagar'}],FP.status,'Todas')}</select></label>
    <label>Categoria<select onchange="FP.cat=this.value;render()">${opcoes(catsTipo('saida'),FP.cat,'Todas')}</select></label>
    <label>Buscar<input type="search" value="${esc(FP.busca)}" placeholder="Fornecedor, nº ou item" onchange="FP.busca=this.value;render()"></label>
    <button class="btn btn-sec" onclick="FP={de:iniMes(),ate:fimMes(),doc:'',status:'',cat:'',busca:''};render()">Limpar</button>
  </div>
  ${kpis([['Comprado com nota',brl(tn),''],['Comprado com recibo',brl(tr),''],['Sem nota no período',(tn+tr?Math.round(tr/(tn+tr)*100):0)+'%',tr>tn?'neg':''],['A pagar',brl(tap),tap?'neg':'']])}
  <section class="bloco nao-imprimir"><h2>Nota x recibo, mês a mês</h2><div class="gr"><canvas id="gc"></canvas></div></section>
  ${lista.length?`<div class="tab-wrap"><table><thead><tr><th>Data</th><th>Documento</th><th>Fornecedor</th><th>Descrição</th><th>Categoria</th><th>Situação</th><th class="n">Valor</th><th class="acoes-l"></th></tr></thead><tbody>${
    lista.map(c=>`<tr><td>${dBR(c.data)}</td><td><span class="tag ${c.doc}">${DOC_PAG[c.doc]||'Recibo'}</span> ${esc(c.numero||'')}</td><td>${esc(c.fornecedor)}${c.doctoForn?`<div class="dica">${esc(c.doctoForn)}</div>`:''}</td><td>${esc(c.descricao||'')}${c.parcelaTxt?` <span class="tag">${c.parcelaTxt}</span>`:''}${c.recId?' <span class="tag">recorrente</span>':''}</td><td>${esc(catNome(c.categoriaId))}</td><td>${c.pago?`<span class="tag paga">paga ${dBR(c.dataPag)}</span>`:`<span class="tag ${c.venc&&c.venc<hoje()?'vencida':''}">a pagar${c.venc?' '+dBR(c.venc):''}</span>`}</td><td class="n">${brl(c.valor)}</td><td class="acoes-l">${c.pago?'':`<button class="btn btn-p" onclick="modalPagarCompra('${c.id}')">Pagar</button>`}<button class="ic" onclick="modalCompra('${c.id}')">Editar</button><button class="ic del" onclick="excluirCompra('${c.id}')">Excluir</button></td></tr>`).join('')
  }</tbody><tfoot><tr><td colspan="6">${lista.length} compra(s)</td><td class="n">${brl(tn+tr)}</td><td></td></tr></tfoot></table></div>`:'<p class="vazio bloco">Nenhuma compra no período. Use + Nova compra para lançar.</p>'}`;
  const meses=ultimos12();
  const pm=d=>meses.map(k=>soma(D.compras.filter(c=>c.doc===d&&c.data.startsWith(k))));
  grafico('gc',{type:'bar',data:{labels:meses.map(mesNome),datasets:[{label:'Nota fiscal',data:pm('nota'),backgroundColor:'#25272b'},{label:'Recibo',data:pm('recibo'),backgroundColor:'#F2B200'}]},options:{scales:{x:{stacked:true},y:{stacked:true,...eixoBRL}}}});
}
function modalCompra(id,origem){
  const c=id?D.compras.find(x=>x.id===id):{data:hoje(),doc:origem?'outro':'nota',numero:'',fornecedor:'',doctoForn:'',descricao:'',valor:'',categoriaId:catPorNome(origem?'Outras despesas':'Compras de materiais','saida'),centroId:'',pago:false,dataPag:'',forma:'PIX',venc:''};
  if(!c)return;
  const cond0=origem==='recorrente'?'recorrente':'prazo';
  const blkPago=`<label>Data do pagamento<input type="date" id="c-dpag" value="${c.dataPag||c.data}"></label><label>Forma<select id="c-forma">${opcoes(FORMAS,c.forma)}</select></label>`;
  const blkPrazo=`<label class="inteiro">Vencimento<input type="date" id="c-venc" value="${c.venc||''}"></label>`;
  const cond=id?`<label class="inteiro check"><input type="checkbox" id="c-pago" ${c.pago?'checked':''} onchange="$('#cb-pago').style.display=this.checked?'contents':'none';$('#cb-prazo').style.display=this.checked?'none':'contents'">Já foi paga (lança a saída no caixa)</label>
    <div id="cb-pago" style="display:${c.pago?'contents':'none'}">${blkPago}</div><div id="cb-prazo" style="display:${c.pago?'none':'contents'}">${blkPrazo}</div>`
   :`<div class="inteiro"><span class="rot">Pagamento</span><div class="seg seg4">${[['pago','Já paga'],['prazo','A pagar'],['parcelado','Parcelado'],['recorrente','Recorrente']].map(([k,t])=>`<label><input type="radio" name="ccond" value="${k}" ${k===cond0?'checked':''} onchange="trocarCondCompra()">${t}</label>`).join('')}</div></div>
    <div id="cb-pago" style="display:none">${blkPago}</div>
    <div id="cb-prazo" style="display:${cond0==='prazo'?'contents':'none'}">${blkPrazo}</div>
    <div id="cb-parcelado" style="display:none">${gradeParcHtml('cp','c-valor',addMeses(hoje(),1))}</div>
    <div id="cb-recorrente" style="display:${cond0==='recorrente'?'contents':'none'}"><label>1º vencimento<input type="date" id="cr-ini" value="${addMeses(hoje(),1)}"></label><label>Repetir até (opcional)<input type="date" id="cr-fim"></label>
      <p class="dica inteiro" style="margin-top:-6px">O valor informado é o de cada mês. A conta é lançada todo mês no mesmo dia do 1º vencimento, até você excluir.</p></div>`;
  abrirModal(id?'Editar':(origem?'Nova conta a pagar':'Nova compra'),`
  <div class="campos">
    <div class="inteiro seg"><label><input type="radio" name="cdoc" value="nota" ${c.doc==='nota'?'checked':''}>Nota fiscal</label><label><input type="radio" name="cdoc" value="recibo" ${c.doc==='recibo'?'checked':''}>Recibo</label><label><input type="radio" name="cdoc" value="outro" ${c.doc==='outro'?'checked':''}>Outro (boleto, fatura)</label></div>
    <label>Data<input type="date" id="c-data" value="${c.data}"></label>
    <label>Número do documento<input id="c-num" value="${esc(c.numero)}" placeholder="Opcional"></label>
    <label>Fornecedor (opcional)<span class="campo-icone"><input id="c-forn" list="dl-forn" value="${esc(c.fornecedor)}" placeholder="Digite para buscar" autocomplete="off" onchange="preencherDocForn()"><button type="button" class="btn-ic" title="Cadastrar fornecedor" aria-label="Cadastrar fornecedor" onclick="modalFornecedor(null,true)">${ICONE_FORN}</button></span><datalist id="dl-forn">${listaFornNomes().map(f=>`<option value="${esc(f)}">`).join('')}</datalist></label>
    <label>CNPJ / CPF do fornecedor<input id="c-docf" value="${esc(c.doctoForn||'')}" placeholder="Opcional"></label>
    <label class="inteiro">Descrição<input id="c-desc" value="${esc(c.descricao)}" placeholder="Ex.: 2 dentes de caçamba e filtro de óleo / Internet"></label>
    <label>${id?'Valor (R$)':'Valor total (R$)'}<input id="c-valor" inputmode="decimal" value="${c.valor?num(c.valor):''}" placeholder="0,00"></label>
    <label>Categoria<select id="c-cat">${opcoes(catsTipo('saida'),c.categoriaId)}</select></label>
    <label class="inteiro">Obra / máquina (opcional)<select id="c-centro">${opcoes(centrosAtivos(),c.centroId,'Nenhuma')}</select></label>
    ${cond}
  </div>`,()=>{
    const d={data:val('c-data'),doc:document.querySelector('input[name=cdoc]:checked').value,numero:val('c-num'),fornecedor:val('c-forn'),doctoForn:val('c-docf'),descricao:val('c-desc'),valor:parseValor(val('c-valor')),categoriaId:val('c-cat'),centroId:val('c-centro'),forma:val('c-forma')};
    if(!d.data){toast('Informe a data.','erro');return false;}
    if(d.valor<=0){toast('Informe um valor maior que zero.','erro');return false;}
    d.fornecedorId=fornPorNome(d.fornecedor)?.id||'';
    if(id){
      d.pago=chk('c-pago');d.dataPag=val('c-dpag');d.venc=val('c-venc');
      if(!d.pago){d.dataPag='';if(!d.venc)d.venc=d.data;}else if(!d.dataPag)d.dataPag=d.data;
      Object.assign(c,d);syncCompraLanc(c);salvar();render();toast('Alteração salva.');return;
    }
    const tipo=document.querySelector('input[name=ccond]:checked').value;
    if(tipo==='parcelado'){
      const rows=validarGrade('cp',d.valor);if(!rows)return false;
      const g=uid();rows.forEach((r,i)=>D.compras.push({id:uid(),...d,valor:r.valor,venc:r.venc,pago:false,dataPag:'',lancId:null,grupoId:g,parcelaTxt:`${i+1}/${rows.length}`}));
      salvar();render();toast(`${rows.length} parcelas lançadas em Contas a pagar.`);return;
    }
    if(tipo==='recorrente'){
      const ini=val('cr-ini');if(!ini){toast('Informe o 1º vencimento.','erro');return false;}
      const fim=val('cr-fim');if(fim&&fim<ini){toast('A data final é anterior ao 1º vencimento.','erro');return false;}
      D.recorrentes.push({id:uid(),descricao:d.descricao||d.fornecedor||catNome(d.categoriaId),fornecedor:d.fornecedor,fornecedorId:d.fornecedorId,doctoForn:d.doctoForn,doc:d.doc,valor:d.valor,categoriaId:d.categoriaId,centroId:d.centroId,forma:'Boleto',inicio:ini,dia:+ini.slice(8,10),fim,pulados:[]});
      const n=gerarRecorrentes();salvar();render();toast(`Conta recorrente criada. ${n} vencimento(s) já lançado(s).`);return;
    }
    const cp={id:uid(),lancId:null,...d,pago:tipo==='pago',dataPag:tipo==='pago'?(val('c-dpag')||d.data):'',venc:tipo==='pago'?'':(val('c-venc')||d.data),grupoId:'',parcelaTxt:''};
    D.compras.push(cp);syncCompraLanc(cp);salvar();render();toast(origem?'Conta a pagar salva.':'Compra salva.');
  });
}
function trocarCondCompra(){const v=document.querySelector('input[name=ccond]:checked').value;['pago','prazo','parcelado','recorrente'].forEach(k=>{const e=$('#cb-'+k);if(e)e.style.display=k===v?'contents':'none';});}
function modalPagarCompra(id){
  const c=D.compras.find(x=>x.id===id);if(!c)return;
  abrirModal('Pagar compra',`<p>${esc(c.fornecedor||'Compra sem fornecedor')}, ${brl(c.valor)}</p><div class="campos"><label>Data do pagamento<input type="date" id="pc-data" value="${hoje()}"></label><label>Forma<select id="pc-forma">${opcoes(FORMAS,'PIX')}</select></label></div><p class="dica">A saída será lançada no caixa automaticamente.</p>`,()=>{
    c.pago=true;c.dataPag=val('pc-data')||hoje();c.forma=val('pc-forma');syncCompraLanc(c);salvar();render();toast('Compra paga e lançada no caixa.');
  },'Confirmar pagamento');
}
function excluirCompra(id){
  const c=D.compras.find(x=>x.id===id);if(!c)return;
  const extra=c.pago?' A saída no caixa também será excluída.':'';
  const outras=c.grupoId?D.compras.filter(x=>x.grupoId===c.grupoId&&x.id!==id&&!x.pago):[];
  if(outras.length)return perguntarGrupo('Excluir parcela',`${esc(c.descricao||c.fornecedor||'Lançamento')} parcelado, parcela ${c.parcelaTxt}, ${brl(c.valor)}.${extra}`,outras.length,todas=>apagarCompras([id].concat(todas?outras.map(x=>x.id):[])));
  if(c.recId&&D.recorrentes.some(r=>r.id===c.recId)){
    abrirModal('Excluir conta recorrente',`<p>${esc(c.descricao||'')}, vencimento ${dBR(vencC(c))}, ${brl(c.valor)}.${extra}</p><div class="campos"><label class="inteiro check"><input type="radio" name="ex-r" value="uma" checked> Excluir só este mês</label><label class="inteiro check"><input type="radio" name="ex-r" value="daqui"> Excluir a conta recorrente a partir deste vencimento</label></div>`,()=>{
      if(document.querySelector('input[name=ex-r]:checked').value==='daqui'){const v=vencC(c),rid=c.recId;apagarCompras([id],true);encerrarRecorrente(rid,v);}else apagarCompras([id]);
    },'Excluir');return;
  }
  if(!confirm(`Excluir ${c.fornecedor?'o lançamento de '+c.fornecedor:'este lançamento'} (${brl(c.valor)})?${extra}`))return;
  apagarCompras([id]);
}
function apagarCompras(ids,semPular){
  D.compras.filter(x=>ids.includes(x.id)).forEach(c=>{
    if(c.lancId)D.lancamentos=D.lancamentos.filter(l=>l.id!==c.lancId);
    if(c.recId&&!semPular){const rc=D.recorrentes.find(r=>r.id===c.recId);if(rc){rc.pulados=rc.pulados||[];if(!rc.pulados.includes(c.comp))rc.pulados.push(c.comp);}}
  });
  D.compras=D.compras.filter(x=>!ids.includes(x.id));salvar();render();toast(ids.length>1?`${ids.length} lançamentos excluídos.`:'Lançamento excluído.');
}
function exportarCompras(){
  baixarCSV(`compras_${FP.de}_${FP.ate}.csv`,['Data','Documento','Número','Fornecedor','CNPJ/CPF','Descrição','Categoria','Obra/máquina','Situação','Data pagamento','Valor'],
    filtrarCompras().map(c=>[dBR(c.data),({nota:'Nota fiscal',recibo:'Recibo',outro:'Outro'})[c.doc]||'',c.numero,c.fornecedor,c.doctoForn,c.descricao,catNome(c.categoriaId),centroNome(c.centroId),c.pago?'Paga':'A pagar',dBR(c.dataPag),c.valor]));
}

/* ================== CONTAS A PAGAR ================== */
const vencC=c=>c.venc||c.data;
function telaPagar(m){
  const h=hoje();
  const doForn=c=>!FA.forn||c.fornecedor===FA.forn;
  const lista=D.compras.filter(c=>doForn(c)&&(FA.status==='aberto'?!c.pago:FA.status==='pago'?c.pago:true)&&(!FA.de||vencC(c)>=FA.de)&&(!FA.ate||vencC(c)<=FA.ate))
    .sort((a,b)=>FA.status==='pago'?(b.dataPag||'').localeCompare(a.dataPag||''):vencC(a).localeCompare(vencC(b)));
  const abertas=D.compras.filter(c=>!c.pago&&doForn(c));
  const venc=abertas.filter(c=>vencC(c)<h),sete=abertas.filter(c=>vencC(c)>=h&&vencC(c)<=addDias(h,7));
  const pagoMes=D.compras.filter(c=>c.pago&&doForn(c)&&(c.dataPag||'').startsWith(h.slice(0,7)));
  const porForn=agrupar(abertas,c=>c.fornecedor||'Sem fornecedor');
  m.innerHTML=`<div class="cab-print"><img src="${$('.logo img').src}" alt=""><span>Contas a pagar${FA.forn?': '+esc(FA.forn):''}</span></div>
  <div class="topo"><div><h1>Contas a pagar</h1><p class="sub">Vencimentos e pagamentos a fornecedores</p></div>
  <div class="acoes"><button class="btn" onclick="modalCompra(null,'pagar')">+ Nova conta a pagar</button><button class="btn btn-sec" onclick="modalCompra(null,'recorrente')">+ Conta recorrente</button><button class="btn btn-sec" onclick="abaCad='saida';ir('cadastros')">Fornecedores</button><button class="btn btn-sec" onclick="window.print()">Imprimir</button></div></div>
  <div class="filtros">
    <label>Situação<select onchange="FA.status=this.value;render()">${opcoes([{id:'aberto',nome:'A pagar'},{id:'pago',nome:'Pagas'},{id:'todas',nome:'Todas'}],FA.status)}</select></label>
    <label>Fornecedor<input list="dl-fa" value="${esc(FA.forn)}" placeholder="Todos" onchange="FA.forn=this.value.trim();render()"><datalist id="dl-fa">${listaFornNomes().map(f=>`<option value="${esc(f)}">`).join('')}</datalist></label>
    <label>Vencimento de<input type="date" value="${FA.de}" onchange="FA.de=this.value;render()"></label>
    <label>Até<input type="date" value="${FA.ate}" onchange="FA.ate=this.value;render()"></label>
    <button class="btn btn-sec" onclick="FA={de:'',ate:'',forn:'',status:'aberto'};render()">Limpar</button>
  </div>
  ${kpis([['Total a pagar',brl(soma(abertas)),''],['Vencidas',venc.length?`${venc.length} / ${brl(soma(venc))}`:'Nenhuma',venc.length?'neg':'pos'],['Vencem em 7 dias',brl(soma(sete)),''],['Pago a fornecedores no mês',brl(soma(pagoMes)),'']])}
  ${lista.length?`<div class="tab-wrap"><table><thead><tr><th>${FA.status==='pago'?'Pago em':'Vencimento'}</th><th>Fornecedor</th><th>Documento</th><th>Descrição</th><th>Situação</th><th class="n">Valor</th><th class="acoes-l"></th></tr></thead><tbody>${
    lista.map(c=>`<tr><td>${dBR(c.pago&&FA.status==='pago'?c.dataPag:vencC(c))}</td><td>${esc(c.fornecedor||'Sem fornecedor')}</td><td><span class="tag ${c.doc}">${DOC_PAG[c.doc]||'Recibo'}</span> ${esc(c.numero||'')}</td><td>${esc(c.descricao||'')}${c.parcelaTxt?` <span class="tag">${c.parcelaTxt}</span>`:''}${c.recId?' <span class="tag">recorrente</span>':''}</td>
    <td>${c.pago?`<span class="tag paga">paga ${dBR(c.dataPag)}</span>`:vencC(c)<h?'<span class="tag vencida">vencida</span>':vencC(c)===h?'<span class="tag recibo">vence hoje</span>':'<span class="tag">a vencer</span>'}</td>
    <td class="n">${brl(c.valor)}</td><td class="acoes-l">${c.pago?`<button class="ic" onclick="desfazerPagCompra('${c.id}')">Desfazer pagamento</button>`:`<button class="btn btn-p" onclick="modalPagarCompra('${c.id}')">Pagar</button><button class="ic" onclick="modalCompra('${c.id}')">Editar</button>`}<button class="ic del" onclick="excluirCompra('${c.id}')">Excluir</button></td></tr>`).join('')
  }</tbody><tfoot><tr><td colspan="5">${lista.length} conta(s)</td><td class="n">${brl(soma(lista))}</td><td></td></tr></tfoot></table></div>`:'<p class="vazio bloco">Nenhuma conta encontrada. Para lançar, use + Nova conta a pagar e deixe desmarcado "Já foi paga".</p>'}
  ${porForn.length?`<section class="bloco" style="margin-top:18px"><h2>Em aberto por fornecedor</h2><table><tbody>${porForn.map(([f,v])=>`<tr><td>${f==='Sem fornecedor'?f:`<button class="link" data-f="${esc(f)}" onclick="FA.forn=this.dataset.f;render()">${esc(f)}</button>`}</td><td class="n">${brl(v)}</td></tr>`).join('')}</tbody></table></section>`:''}
  ${recorrentesHtml()}`;

function diaNoMes(k,dia){const [y,m]=k.split('-').map(Number);const ult=new Date(y,m,0).getDate();return k+'-'+String(Math.min(dia,ult)).padStart(2,'0');}
function gerarRecorrentes(){
  const hj=new Date(),lim=fmtISO(new Date(hj.getFullYear(),hj.getMonth()+2,0));let n=0;
  (D.recorrentes||[]).forEach(rc=>{
    const k0=rc.inicio.slice(0,7);
    for(let i=0;i<600;i++){
      const k=addMeses(k0+'-01',i).slice(0,7),venc=diaNoMes(k,rc.dia);
      if(venc>lim||(rc.fim&&venc>rc.fim))break;
      if(venc<rc.inicio||(rc.pulados||[]).includes(k)||D.compras.some(c=>c.recId===rc.id&&c.comp===k))continue;
      D.compras.push({id:uid(),recId:rc.id,comp:k,data:venc,venc,doc:rc.doc||'outro',numero:'',fornecedor:rc.fornecedor||'',fornecedorId:rc.fornecedorId||'',doctoForn:rc.doctoForn||'',descricao:rc.descricao,valor:rc.valor,categoriaId:rc.categoriaId,centroId:rc.centroId||'',pago:false,dataPag:'',forma:rc.forma||'Boleto',lancId:null,grupoId:'',parcelaTxt:''});n++;
    }
  });
  return n;
}
function recorrentesHtml(){
  if(!D.recorrentes.length)return '';const h=hoje();
  return `<section class="bloco" style="margin-top:18px"><h2>Contas recorrentes</h2><p class="dica" style="margin-top:-6px">Lançadas automaticamente em Contas a pagar até o fim do mês seguinte.</p>

function encerrarRecorrente(rid,aPartir){
  const rc=D.recorrentes.find(r=>r.id===rid);if(!rc)return;

function excluirReceber(id){
  const r=D.receber.find(x=>x.id===id);if(!r)return;
  const extra=r.recebido?' A entrada no caixa também será excluída.':'';
  const outras=r.grupoId?D.receber.filter(x=>x.grupoId===r.grupoId&&x.id!==id&&!x.recebido):[];
  const apagar=ids=>{D.receber.filter(x=>ids.includes(x.id)).forEach(x=>{if(x.lancId)D.lancamentos=D.lancamentos.filter(l=>l.id!==x.lancId);});D.receber=D.receber.filter(x=>!ids.includes(x.id));salvar();render();toast(ids.length>1?`${ids.length} parcelas excluídas.`:'Conta excluída.');};
  if(outras.length)return perguntarGrupo('Excluir parcela',`Recebimento parcelado${r.cliente?' de '+esc(r.cliente):''}, parcela ${r.parcelaTxt}, ${brl(r.valor)}.${extra}`,outras.length,t=>apagar([id].concat(t?outras.map(x=>x.id):[])));
  if(!confirm(`Excluir esta conta a receber${r.cliente?' de '+r.cliente:''} (${brl(r.valor)})?${extra}`))return;
  apagar([id]);
}

const UNIDADES=['h','m³','m²','m','viagem','diária','km','t','un','vb'];
const numOrc=o=>String(o.numero||0).padStart(4,'0');
const totalItens=o=>r2((o.itens||[]).reduce((a,i)=>a+r2((+i.qtd||0)*(+i.vunit||0)),0));
const totalOrc=o=>r2(totalItens(o)-(+o.desconto||0));
const validadeOrc=o=>addDias(o.data,+o.validade||0);
const fmtQtd=q=>(+q||0).toLocaleString('pt-BR',{maximumFractionDigits:3});
function statusOrcTag(o){if(o.status==='aprovado')return `<span class="tag paga">aprovado</span>`;if(o.status==='recusado')return '<span class="tag">recusado</span>';return validadeOrc(o)<hoje()?'<span class="tag vencida">validade vencida</span>':'<span class="tag recibo">em aberto</span>';}
function telaOrcamentos(m){
  const h=hoje(),b=FO.busca.toLowerCase();
  const noP=o=>(!FO.de||o.data>=FO.de)&&(!FO.ate||o.data<=FO.ate);
  const lista=D.orcamentos.filter(o=>noP(o)&&(!FO.status||o.status===FO.status)&&(!b||(o.cliente||'').toLowerCase().includes(b)||(o.local||'').toLowerCase().includes(b)||numOrc(o).includes(b))).sort((x,y)=>y.numero-x.numero);
  const per=D.orcamentos.filter(noP),ab=per.filter(o=>o.status==='aberto'),ap=per.filter(o=>o.status==='aprovado'),dec=per.filter(o=>o.status!=='aberto');
  const tot=a=>a.reduce((s,o)=>s+totalOrc(o),0);
  m.innerHTML=`<div class="topo"><div><h1>Orçamentos</h1><p class="sub">Propostas de serviço para clientes</p></div>
  <div class="acoes"><button class="btn" onclick="modalOrcamento()">+ Novo orçamento</button></div></div>
  <div class="filtros">
    <label>Situação<select onchange="FO.status=this.value;render()">${opcoes([{id:'aberto',nome:'Em aberto'},{id:'aprovado',nome:'Aprovados'},{id:'recusado',nome:'Recusados'}],FO.status,'Todos')}</select></label>
    <label>Emitidos de<input type="date" value="${FO.de}" onchange="FO.de=this.value;render()"></label>
    <label>Até<input type="date" value="${FO.ate}" onchange="FO.ate=this.value;render()"></label>
    <label>Buscar<input type="search" value="${esc(FO.busca)}" placeholder="Cliente, local ou nº" onchange="FO.busca=this.value;render()"></label>
    <button class="btn btn-sec" onclick="FO={status:'',busca:'',de:'',ate:''};render()">Limpar</button>
  </div>
  ${kpis([['Em aberto',`${ab.length} / ${brl(tot(ab))}`,''],['Aprovados',`${ap.length} / ${brl(tot(ap))}`,'pos'],['Taxa de aprovação',dec.length?Math.round(ap.length/dec.length*100)+'%':'Sem dados',''],['Com validade vencida',String(ab.filter(o=>validadeOrc(o)<h).length),'']])}
  ${lista.length?`<div class="tab-wrap"><table><thead><tr><th>Nº</th><th>Emissão</th><th>Cliente</th><th>Local / serviço</th><th>Validade</th><th>Situação</th><th class="n">Total</th><th class="acoes-l"></th></tr></thead><tbody>${
    lista.map(o=>`<tr><td><b>${numOrc(o)}</b></td><td>${dBR(o.data)}</td><td>${esc(o.cliente)}</td><td>${esc(o.local||(o.itens[0]&&o.itens[0].desc)||'')}</td><td>${dBR(validadeOrc(o))}</td><td>${statusOrcTag(o)}${o.receberLancado?' <span class="tag">a receber lançado</span>':''}</td><td class="n">${brl(totalOrc(o))}</td>
    <td class="acoes-l"><button class="btn btn-sec btn-p" onclick="imprimirOrc('${o.id}')">Imprimir / PDF</button>${o.status==='aberto'?`<button class="ic" onclick="aprovarOrc('${o.id}')">Aprovar</button><button class="ic" onclick="recusarOrc('${o.id}')">Recusar</button>`:`<button class="ic" onclick="reabrirOrc('${o.id}')">Reabrir</button>`}${o.status==='aprovado'&&!o.receberLancado?`<button class="ic" onclick="lancarReceberOrc('${o.id}')">Lançar a receber</button>`:''}<button class="ic" onclick="modalOrcamento('${o.id}')">Editar</button><button class="ic" onclick="modalOrcamento('${o.id}',true)">Duplicar</button><button class="ic del" onclick="excluirOrc('${o.id}')">Excluir</button></td></tr>`).join('')
  }</tbody></table></div>`:'<p class="vazio bloco">Nenhum orçamento encontrado. Use + Novo orçamento para criar o primeiro.</p>'}`;
}
function addItemOrc(i){
  i=i||{desc:'',qtd:'',un:'h',vunit:0};
  const tr=document.createElement('tr');
  tr.innerHTML=`<td><input class="oi-desc" value="${esc(i.desc)}" placeholder="Ex.: Hora de escavadeira hidráulica" aria-label="Descrição do item"></td>
  <td style="width:90px"><input class="oi-qtd" value="${i.qtd!==''?fmtQtd(i.qtd):''}" placeholder="0" aria-label="Quantidade" oninput="recalcOrc()"></td>
  <td style="width:96px"><select class="oi-un" aria-label="Unidade">${opcoes(UNIDADES,i.un)}</select></td>
  <td style="width:130px"><input class="oi-vu" inputmode="decimal" value="${i.vunit?num(i.vunit):''}" placeholder="0,00" aria-label="Valor unitário" oninput="setTimeout(recalcOrc)"></td>
  <td class="n oi-tot" style="width:120px;padding-top:12px"></td>
  <td style="width:70px"><button type="button" class="ic del" onclick="this.closest('tr').remove();recalcOrc()">Remover</button></td>`;
  $('#o-itens').appendChild(tr);recalcOrc();
}
function lerItensOrc(){return [...document.querySelectorAll('#o-itens tr')].map(tr=>({desc:tr.querySelector('.oi-desc').value.trim(),qtd:parseValor(tr.querySelector('.oi-qtd').value),un:tr.querySelector('.oi-un').value,vunit:parseValor(tr.querySelector('.oi-vu').value)})).filter(i=>i.desc||i.vunit);}
function recalcOrc(){
  document.querySelectorAll('#o-itens tr').forEach(tr=>{tr.querySelector('.oi-tot').textContent=brl(r2(parseValor(tr.querySelector('.oi-qtd').value)*parseValor(tr.querySelector('.oi-vu').value)));});
  const o={itens:lerItensOrc(),desconto:parseValor(val('o-desc'))};const t=$('#o-total');if(t)t.textContent=brl(totalOrc(o));
}
function preencherCliOrc(){const c=cliPorNome(val('o-cli'));if(!c)return;if(c.doc&&!val('o-docc'))$('#o-docc').value=c.doc;if(c.telefone&&!val('o-tel'))$('#o-tel').value=c.telefone;}
function modalOrcamento(id,dup){
  let o;
  if(id){const src=D.orcamentos.find(x=>x.id===id);if(!src)return;o=dup?Object.assign(JSON.parse(JSON.stringify(src)),{id:null,numero:null,data:hoje(),status:'aberto',dataAprov:'',receberLancado:false}):src;}
  else o={data:hoje(),validade:15,cliente:'',docCli:'',telefone:'',local:'',itens:[],desconto:0,condicoes:'',prazo:'',obs:'',status:'aberto'};
  const editando=!!(id&&!dup);
  abrirModal(editando?`Orçamento nº ${numOrc(o)}`:(dup?'Novo orçamento (cópia)':'Novo orçamento'),`
  <div class="campos">
    <label>Data<input type="date" id="o-data" value="${o.data}"></label>

    <label>Cliente<span class="campo-icone"><input id="o-cli" list="dl-ocli" value="${esc(o.cliente)}" placeholder="Digite para buscar" autocomplete="off" onchange="preencherCliOrc()"><button type="button" class="btn-ic" title="Cadastrar cliente" aria-label="Cadastrar cliente" onclick="modalCliente(null,true,{cli:'o-cli',dl:'dl-ocli',doc:'o-docc',tel:'o-tel'})">${ICONE_FORN}</button></span><datalist id="dl-ocli">${listaCliNomes().map(f=>`<option value="${esc(f)}">`).join('')}</datalist></label>

    <label>Telefone / contato<input id="o-tel" value="${esc(o.telefone||'')}" placeholder="Opcional"></label>
    <label>Local da obra / serviço<input id="o-local" value="${esc(o.local||'')}" placeholder="Ex.: Rua das Flores, lote 12, Itirapina"></label>
    <div class="inteiro"><span class="rot">Itens do orçamento</span><div class="tab-wrap itens-orc"><table><thead><tr><th>Descrição</th><th>Qtd</th><th>Un.</th><th class="n">Valor unit.</th><th class="n">Total</th><th></th></tr></thead><tbody id="o-itens"></tbody></table></div>
      <button type="button" class="btn btn-sec btn-p" style="margin-top:8px" onclick="addItemOrc()">+ Item</button></div>
    <label>Desconto (R$)<input id="o-desc" inputmode="decimal" value="${o.desconto?num(o.desconto):''}" placeholder="0,00" oninput="setTimeout(recalcOrc)"></label>
    <div class="total-orc"><span>Total do orçamento</span><b id="o-total">R$ 0,00</b></div>
    <label class="inteiro">Condições de pagamento<input id="o-cond" value="${esc(o.condicoes||'')}" placeholder="Ex.: 50% na aprovação e 50% na conclusão, via PIX"></label>
    <label class="inteiro">Prazo de execução<input id="o-prazo" value="${esc(o.prazo||'')}" placeholder="Ex.: 5 dias úteis após a liberação da área"></label>
    <label class="inteiro">Observações<textarea id="o-obs" rows="3" placeholder="Ex.: Mobilização da máquina inclusa. Não inclui licenças ambientais nem remoção de entulho.">${esc(o.obs||'')}</textarea></label>
  </div>`,()=>{
    const itens=lerItensOrc();
    const d={data:val('o-data')||hoje(),validade:Math.max(1,parseInt(val('o-val'))||15),cliente:val('o-cli'),docCli:val('o-docc'),telefone:val('o-tel'),local:val('o-local'),itens,desconto:parseValor(val('o-desc')),condicoes:val('o-cond'),prazo:val('o-prazo'),obs:val('o-obs')};
    if(!d.cliente){toast('Informe o cliente.','erro');return false;}
    if(!itens.length){toast('Inclua pelo menos um item.','erro');return false;}
    if(itens.some(i=>!i.desc||i.qtd<=0||i.vunit<=0)){toast('Cada item precisa de descrição, quantidade e valor unitário.','erro');return false;}
    if(totalOrc(d)<=0){toast('O desconto não pode ser maior que o total.','erro');return false;}
    d.clienteId=cliPorNome(d.cliente)?.id||'';
    let alvo;
    if(editando){alvo=o;Object.assign(alvo,d);}
    else{D.seqOrc=(D.seqOrc||0)+1;alvo={id:uid(),numero:D.seqOrc,status:'aberto',dataAprov:'',receberLancado:false,...d};D.orcamentos.push(alvo);}
    salvar();render();toast(`Orçamento nº ${numOrc(alvo)} salvo.`);
  },'Salvar orçamento',true);
  (o.itens.length?o.itens:[null]).forEach(i=>addItemOrc(i));

function aprovarOrc(id){
  const o=D.orcamentos.find(x=>x.id===id);if(!o)return;
  o.status='aprovado';o.dataAprov=hoje();salvar();render();
  if(confirm(`Orçamento nº ${numOrc(o)} aprovado.\n\nDeseja lançar ${brl(totalOrc(o))} em Contas a receber agora?`))lancarReceberOrc(id);
}
function lancarReceberOrc(id){
  const o=D.orcamentos.find(x=>x.id===id);if(!o)return;
  modalReceber(null,{cliente:o.cliente,doctoCli:o.docCli||'',descricao:`Orçamento nº ${numOrc(o)}${o.local?' - '+o.local:''}`,valor:totalOrc(o),orcId:o.id});
}
function recusarOrc(id){const o=D.orcamentos.find(x=>x.id===id);if(!o)return;o.status='recusado';salvar();render();toast('Orçamento marcado como recusado.');}
function reabrirOrc(id){const o=D.orcamentos.find(x=>x.id===id);if(!o)return;o.status='aberto';o.dataAprov='';salvar();render();toast('Orçamento reaberto.');}
function excluirOrc(id){const o=D.orcamentos.find(x=>x.id===id);if(!o)return;if(!confirm(`Excluir o orçamento nº ${numOrc(o)} de ${o.cliente}?${o.receberLancado?'\nAs contas a receber já lançadas não serão apagadas.':''}`))return;D.orcamentos=D.orcamentos.filter(x=>x.id!==id);salvar();render();toast('Orçamento excluído.');}

  .ex{-webkit-print-color-adjust:exact;print-color-adjust:exact}.cab{background:#000;color:#cfd1d4;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px 18px}.cab img{height:60px}.cab .emp{text-align:right;font-size:11.5px;line-height:1.55}
  .faixa{height:8px;background:repeating-linear-gradient(-45deg,#F2B200 0 10px,#000 10px 20px)}
  h1{font-family:'Saira Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:800;font-size:32px;margin:18px 0 2px}.meta{color:#5c6168;margin-bottom:14px}
  .box{border:1px solid #d3d6da;padding:10px 12px;margin-bottom:16px;display:grid;grid-template-columns:1fr 1fr;gap:5px 18px}.box span{color:#5c6168}
