/* ================== CLIENTES ================== */
function modalCliente(id,rapido,alvo){
  alvo=alvo||{cli:'r-cli',dl:'dl-cli',doc:'r-docc'};
  const c=id?D.clientes.find(x=>x.id===id):{nome:rapido?val(alvo.cli):'',doc:'',telefone:'',email:'',cidade:'',obs:''};
  if(!c)return;
  const corpo=`<div class="campos"><label class="inteiro">Nome ou razão social<input id="cl-nome" value="${esc(c.nome)}"></label>
  <label>CNPJ / CPF<input id="cl-doc" value="${esc(c.doc||'')}"></label><label>Telefone / WhatsApp<input id="cl-tel" value="${esc(c.telefone||'')}"></label>
  <label>E-mail<input id="cl-email" value="${esc(c.email||'')}"></label><label>Cidade<input id="cl-cid" value="${esc(c.cidade||'')}"></label>
  <label class="inteiro">Observação<textarea id="cl-obs" rows="2" placeholder="Ex.: contato na obra, dia de pagamento">${esc(c.obs||'')}</textarea></label></div><p class="dica">Só o nome é obrigatório.</p>`;
  const ok=()=>{
    const nome=val('cl-nome');if(!nome){toast('Informe o nome do cliente.','erro');return false;}
    const dup=cliPorNome(nome);if(dup&&dup.id!==id){toast('Já existe um cliente com esse nome.','erro');return false;}
    const d={nome,doc:val('cl-doc'),telefone:val('cl-tel'),email:val('cl-email'),cidade:val('cl-cid'),obs:val('cl-obs')};
    if(id){const antigo=c.nome;Object.assign(c,d);D.receber.forEach(r=>{if(r.clienteId===id||(!r.clienteId&&r.cliente===antigo)){r.cliente=nome;r.clienteId=id;syncReceberLanc(r);}});}
    else D.clientes.push({id:uid(),...d});
    salvar();
    if(rapido){$('#'+alvo.cli).value=nome;$('#'+alvo.dl).innerHTML=listaCliNomes().map(n=>`<option value="${esc(n)}">`).join('');if(d.doc&&!val(alvo.doc))$('#'+alvo.doc).value=d.doc;if(alvo.tel&&d.telefone&&!val(alvo.tel))$('#'+alvo.tel).value=d.telefone;toast('Cliente cadastrado.');}
    else{render();toast('Cliente salvo.');}
  };
  (rapido?abrirModal2:abrirModal)(id?'Editar cliente':'Novo cliente',corpo,ok);
}
function excluirCliente(id){
  const c=D.clientes.find(x=>x.id===id);if(!c)return;
  if(!confirm(`Excluir o cliente "${c.nome}"?\nAs contas já lançadas continuam com o nome dele.`))return;
  D.receber.forEach(r=>{if(r.clienteId===id)r.clienteId='';});
  D.clientes=D.clientes.filter(x=>x.id!==id);salvar();render();toast('Cliente excluído.');
}

/* ================== FORNECEDORES ================== */
function modalFornecedor(id,rapido){
  const f=id?D.fornecedores.find(x=>x.id===id):{nome:rapido?val('c-forn'):'',doc:'',telefone:'',email:'',cidade:'',obs:''};
  if(!f)return;
  const corpo=`<div class="campos"><label class="inteiro">Nome ou razão social<input id="fo-nome" value="${esc(f.nome)}"></label>
  <label>CNPJ / CPF<input id="fo-doc" value="${esc(f.doc||'')}"></label><label>Telefone / WhatsApp<input id="fo-tel" value="${esc(f.telefone||'')}"></label>
  <label>E-mail<input id="fo-email" value="${esc(f.email||'')}"></label><label>Cidade<input id="fo-cid" value="${esc(f.cidade||'')}"></label>
  <label class="inteiro">Observação<textarea id="fo-obs" rows="2" placeholder="Ex.: chave PIX, dados bancários, contato">${esc(f.obs||'')}</textarea></label></div><p class="dica">Só o nome é obrigatório.</p>`;
  const ok=()=>{
    const nome=val('fo-nome');if(!nome){toast('Informe o nome do fornecedor.','erro');return false;}
    const dup=fornPorNome(nome);if(dup&&dup.id!==id){toast('Já existe um fornecedor com esse nome.','erro');return false;}
    const d={nome,doc:val('fo-doc'),telefone:val('fo-tel'),email:val('fo-email'),cidade:val('fo-cid'),obs:val('fo-obs')};
    if(id){const antigo=f.nome;Object.assign(f,d);D.compras.forEach(c=>{if(c.fornecedorId===id||(!c.fornecedorId&&c.fornecedor===antigo)){c.fornecedor=nome;c.fornecedorId=id;syncCompraLanc(c);}});}
    else D.fornecedores.push({id:uid(),...d});
    salvar();
    if(rapido){$('#c-forn').value=nome;$('#dl-forn').innerHTML=listaFornNomes().map(n=>`<option value="${esc(n)}">`).join('');if(d.doc&&!val('c-docf'))$('#c-docf').value=d.doc;toast('Fornecedor cadastrado.');}
    else{render();toast('Fornecedor salvo.');}
  };
  (rapido?abrirModal2:abrirModal)(id?'Editar fornecedor':'Novo fornecedor',corpo,ok);
}
function excluirFornecedor(id){
  const f=D.fornecedores.find(x=>x.id===id);if(!f)return;
  if(!confirm(`Excluir o fornecedor "${f.nome}"?\nAs compras já lançadas continuam com o nome dele.`))return;
  D.compras.forEach(c=>{if(c.fornecedorId===id)c.fornecedorId='';});
  D.fornecedores=D.fornecedores.filter(x=>x.id!==id);salvar();render();toast('Fornecedor excluído.');
}

/* ================== FINANCIAMENTOS, EMPRÉSTIMOS E CONSÓRCIOS ================== */
function resumoContrato(c){
  const ps=c.parcelas||[],pagas=ps.filter(p=>p.pago),abertas=ps.filter(p=>!p.pago);
  return {total:ps.length,pagas:pagas.length,faltam:abertas.length,valorPago:soma(pagas.map(p=>({valor:p.valorPago??p.valor}))),saldo:soma(abertas),proxima:abertas.sort((a,b)=>a.venc.localeCompare(b.venc))[0],vencidas:abertas.filter(p=>p.venc<hoje()).length};
}
function telaContratos(m){
  if(contratoAberto)return telaContrato(m,contratoAberto);
  const h=hoje();
  const lista=D.contratos.filter(c=>(!FK.tipo||c.tipo===FK.tipo)).map(c=>({c,r:resumoContrato(c)})).filter(x=>FK.quitados||x.r.faltam>0);
  const abertas=todasParcelas().filter(x=>!x.p.pago&&(!FK.tipo||x.c.tipo===FK.tipo));
  const venc=abertas.filter(x=>x.p.venc<h);
  const prox30=abertas.filter(x=>x.p.venc>=h&&x.p.venc<=addDias(h,30));
  const pagasMes=todasParcelas().filter(x=>x.p.pago&&x.p.dataPag&&x.p.dataPag.startsWith(h.slice(0,7))&&(!FK.tipo||x.c.tipo===FK.tipo));
  m.innerHTML=`<div class="topo"><div><h1>Financiamentos</h1><p class="sub">Financiamentos, empréstimos e consórcios com controle de parcelas</p></div>
  <div class="acoes"><button class="btn" onclick="modalContrato()">+ Novo contrato</button></div></div>
  <div class="abas">${[['','Todos'],['financiamento','Financiamentos'],['emprestimo','Empréstimos'],['consorcio','Consórcios']].map(([k,t])=>`<button class="${FK.tipo===k?'ativo':''}" onclick="FK.tipo='${k}';render()">${t}</button>`).join('')}</div>
  ${kpis([['Saldo a pagar (parcelas em aberto)',brl(soma(abertas.map(x=>x.p))),''],['Vencidas',venc.length?`${venc.length} / ${brl(soma(venc.map(x=>x.p)))}`:'Nenhuma',venc.length?'neg':'pos'],['Vencem em 30 dias',brl(soma(prox30.map(x=>x.p))),''],['Pago neste mês',brl(soma(pagasMes.map(x=>({valor:x.p.valorPago??x.p.valor})))),'']])}
  <label class="check nao-imprimir" style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><input type="checkbox" ${FK.quitados?'checked':''} onchange="FK.quitados=this.checked;render()">Mostrar contratos quitados</label>
  ${lista.length?lista.map(({c,r})=>`<div class="contrato ${r.faltam?'':'quitado'}">
    <div><span class="tag">${TIPOS_CONTRATO[c.tipo]}</span>${r.vencidas?` <span class="tag vencida">${r.vencidas} vencida(s)</span>`:''}${c.tipo==='consorcio'&&c.contemplado?' <span class="tag paga">contemplado</span>':''}
      <h3>${esc(c.descricao)}</h3><div class="meta">${esc(c.instituicao||'')}${c.bem?', '+esc(c.bem):''}</div></div>
    <div><div class="meta">${r.pagas} de ${r.total} parcelas pagas</div><div class="barra"><i style="width:${r.total?r.pagas/r.total*100:0}%"></i></div>
      <div class="meta">${r.faltam?`Faltam ${r.faltam}, saldo ${brl(r.saldo)}`:'Quitado'}</div>
      ${r.proxima?`<div class="meta">Próxima: ${dBR(r.proxima.venc)}, ${brl(r.proxima.valor)}</div>`:''}</div>
    <div class="acoes">${r.proxima?`<button class="btn btn-p" onclick="modalBaixa('${c.id}',${r.proxima.n})">Pagar próxima</button>`:''}<button class="btn btn-sec btn-p" onclick="contratoAberto='${c.id}';render()">Ver parcelas</button></div>
  </div>`).join(''):'<p class="vazio bloco">Nenhum contrato cadastrado. Use + Novo contrato para lançar um financiamento, empréstimo ou consórcio.</p>'}`;
}
function telaContrato(m,id){
  const c=D.contratos.find(x=>x.id===id);if(!c){contratoAberto=null;return render();}
  const r=resumoContrato(c),h=hoje();
  m.innerHTML=`<div class="cab-print"><img src="${$('.logo img').src}" alt=""><span>${TIPOS_CONTRATO[c.tipo]}: ${esc(c.descricao)}</span></div>
  <div class="topo"><div><p class="sub nao-imprimir"><button class="link" onclick="contratoAberto=null;render()">Voltar para a lista</button></p><h1>${esc(c.descricao)}</h1>
  <p class="sub">${TIPOS_CONTRATO[c.tipo]}${c.instituicao?', '+esc(c.instituicao):''}${c.bem?', '+esc(c.bem):''}${c.valorContratado?`. Valor contratado ${brl(c.valorContratado)}`:''}${c.valorEntrada?`. Entrada ${brl(c.valorEntrada)} em ${dBR(c.dataEntrada)}`:''}</p></div>
  <div class="acoes"><button class="btn btn-sec" onclick="modalContrato('${c.id}')">Editar</button><button class="btn btn-sec" onclick="window.print()">Imprimir</button><button class="btn btn-perigo" onclick="excluirContrato('${c.id}')">Excluir</button></div></div>
  ${kpis([['Parcelas pagas',`${r.pagas} de ${r.total}`,''],['Faltam',String(r.faltam),r.faltam?'':'pos'],[c.valorEntrada?'Total já pago (com entrada)':'Total já pago',brl(r.valorPago+(+c.valorEntrada||0)),''],['Saldo a pagar',brl(r.saldo),r.saldo?'neg':'pos']])}
  <div class="tab-wrap"><table><thead><tr><th>Nº</th><th>Vencimento</th><th class="n">Valor</th><th>Situação</th><th class="n">Valor pago</th><th class="acoes-l"></th></tr></thead><tbody>${
   c.parcelas.map(p=>`<tr><td>${p.n}/${c.parcelas.length}</td><td>${dBR(p.venc)}</td><td class="n">${brl(p.valor)}</td>
   <td>${p.pago?`<span class="tag paga">paga ${p.anterior?'antes do controle':dBR(p.dataPag)}</span>`:p.venc<h?'<span class="tag vencida">vencida</span>':'<span class="tag">em aberto</span>'}</td>
   <td class="n">${p.pago&&!p.anterior?brl(p.valorPago):''}</td>
   <td class="acoes-l">${p.pago?`<button class="ic del" onclick="estornarParcela('${c.id}',${p.n})">Estornar</button>`:`<button class="btn btn-p" onclick="modalBaixa('${c.id}',${p.n})">Dar baixa</button><button class="ic" onclick="modalValorParcela('${c.id}',${p.n})">Alterar valor</button>`}</td></tr>`).join('')
  }</tbody></table></div>`;
}
function gerarParcelas(n,valor,primeiro,jaPagas){
  const out=[];for(let i=0;i<n;i++)out.push({n:i+1,venc:addMeses(primeiro,i),valor,pago:i<jaPagas,anterior:i<jaPagas,dataPag:'',valorPago:i<jaPagas?valor:0,lancId:null});return out;
}
function modalContrato(id){
  const c=id?D.contratos.find(x=>x.id===id):{tipo:'financiamento',descricao:'',instituicao:'',bem:'',valorContratado:'',nParcelas:'',valorParcela:'',primeiroVenc:addMeses(hoje(),1),jaPagas:0,centroId:'',contemplado:false,lancarEntrada:false,dataLiberacao:hoje()};
  if(!c)return;
  const travado=id&&c.parcelas.some(p=>p.lancId);
  abrirModal(id?'Editar contrato':'Novo contrato',`
  <div class="campos">
    <div class="inteiro seg">${Object.entries(TIPOS_CONTRATO).map(([k,t])=>`<label><input type="radio" name="ktipo" value="${k}" ${c.tipo===k?'checked':''} ${travado?'disabled':''} onchange="mostrarCamposTipo()">${t}</label>`).join('')}</div>
    <label class="inteiro">Descrição<input id="k-desc" value="${esc(c.descricao)}" placeholder="Ex.: Escavadeira CAT 320, Capital de giro"></label>
    <label>Banco / administradora<input id="k-inst" value="${esc(c.instituicao||'')}"></label>
    <label>Bem (opcional)<input id="k-bem" value="${esc(c.bem||'')}" placeholder="Ex.: Caminhão basculante"></label>
    <label>Valor contratado / crédito (R$)<input id="k-vc" inputmode="decimal" value="${c.valorContratado?num(c.valorContratado):''}" placeholder="0,00"></label>
    <label>Obra / máquina (opcional)<select id="k-centro">${opcoes(centrosAtivos(),c.centroId,'Nenhuma')}</select></label>
    <label>Valor de entrada (R$)<input id="k-ve" inputmode="decimal" value="${c.valorEntrada?num(c.valorEntrada):''}" placeholder="Se houver"></label>
    <label>Data da entrada<input type="date" id="k-de" value="${c.dataEntrada||hoje()}"></label>
    <label class="inteiro check"><input type="checkbox" id="k-lde" ${c.lancDownId?'checked':''}> Lançar a entrada como saída no caixa</label>
    <p class="dica inteiro" style="margin-top:-6px">Deixe desmarcado se a entrada foi paga antes de começar a usar o sistema. No consórcio, use para lance pago com recurso próprio.</p>
    ${travado?'<p class="dica inteiro">Este contrato já tem parcelas baixadas pelo sistema, então número de parcelas, valores e datas não podem ser refeitos. Use Alterar valor em cada parcela aberta, se precisar.</p>':`
    <label>Nº de parcelas<input id="k-n" type="number" min="1" value="${c.nParcelas||''}"></label>
    <label>Valor da parcela (R$)<input id="k-vp" inputmode="decimal" value="${c.valorParcela?num(c.valorParcela):''}" placeholder="0,00"></label>
    <label>1º vencimento<input type="date" id="k-venc" value="${c.primeiroVenc}"></label>
    <label>Parcelas já pagas antes do controle<input id="k-jp" type="number" min="0" value="${c.jaPagas||0}"></label>
    <p class="dica inteiro">Parcelas pagas antes do controle ficam marcadas como pagas, mas não entram no caixa.</p>`}
    <div id="k-emp" class="inteiro" style="display:${c.tipo==='emprestimo'&&!id?'block':'none'}"><label class="check"><input type="checkbox" id="k-lanc" ${c.lancarEntrada?'checked':''}> Lançar o valor recebido como entrada no caixa</label>
      <label style="margin-top:8px">Data em que o dinheiro entrou<input type="date" id="k-dlib" value="${c.dataLiberacao||hoje()}"></label></div>
    <div id="k-cons" class="inteiro" style="display:${c.tipo==='consorcio'?'block':'none'}"><label class="check"><input type="checkbox" id="k-cont" ${c.contemplado?'checked':''}> Já foi contemplado</label></div>
  </div>`,()=>{
    const tipo=document.querySelector('input[name=ktipo]:checked').value;
    const d={tipo,descricao:val('k-desc'),instituicao:val('k-inst'),bem:val('k-bem'),valorContratado:parseValor(val('k-vc')),centroId:val('k-centro'),contemplado:chk('k-cont'),valorEntrada:parseValor(val('k-ve')),dataEntrada:val('k-de')};
    if(chk('k-lde')&&d.valorEntrada<=0){toast('Informe o valor de entrada para lançar no caixa.','erro');return false;}
    if(!d.descricao){toast('Informe a descrição do contrato.','erro');return false;}
    if(!travado){
      d.nParcelas=parseInt(val('k-n'))||0;d.valorParcela=parseValor(val('k-vp'));d.primeiroVenc=val('k-venc');d.jaPagas=Math.max(0,parseInt(val('k-jp'))||0);
      if(d.nParcelas<1||d.valorParcela<=0||!d.primeiroVenc){toast('Preencha nº de parcelas, valor da parcela e 1º vencimento.','erro');return false;}
      if(d.jaPagas>d.nParcelas){toast('Parcelas já pagas não pode ser maior que o total.','erro');return false;}
    }
    let k;
    if(id){k=c;const mudouParcelas=!travado&&(k.nParcelas!==d.nParcelas||k.valorParcela!==d.valorParcela||k.primeiroVenc!==d.primeiroVenc||k.jaPagas!==d.jaPagas);
      Object.assign(k,d);if(mudouParcelas)k.parcelas=gerarParcelas(d.nParcelas,d.valorParcela,d.primeiroVenc,d.jaPagas);
      k.parcelas.forEach(p=>{if(p.lancId){const l=D.lancamentos.find(x=>x.id===p.lancId);if(l){l.centroId=k.centroId;l.descricao=descParcela(k,p);}}});
      if(k.lancEntradaId){const l=D.lancamentos.find(x=>x.id===k.lancEntradaId);if(l)l.descricao=`Empréstimo recebido: ${k.descricao}${k.instituicao?' ('+k.instituicao+')':''}`;}
    }else{
      k={id:uid(),...d,parcelas:gerarParcelas(d.nParcelas,d.valorParcela,d.primeiroVenc,d.jaPagas)};
      if(tipo==='emprestimo'&&chk('k-lanc')){
        if(d.valorContratado<=0){toast('Informe o valor contratado para lançar a entrada no caixa.','erro');return false;}
        const l={id:uid(),origem:'contrato',refId:k.id,tipo:'entrada',data:val('k-dlib')||hoje(),valor:d.valorContratado,categoriaId:catPorNome('Empréstimo recebido','entrada'),descricao:`Empréstimo recebido: ${d.descricao}${d.instituicao?' ('+d.instituicao+')':''}`,forma:'Transferência',centroId:'',obs:''};
        D.lancamentos.push(l);k.lancEntradaId=l.id;
      }
      D.contratos.push(k);
    }
    syncEntradaContrato(k,chk('k-lde'));
    salvar();render();toast(id?'Contrato alterado.':'Contrato cadastrado com '+k.parcelas.length+' parcelas.');
  });
}
function mostrarCamposTipo(){const t=document.querySelector('input[name=ktipo]:checked').value;const e=$('#k-emp');if(e&&!$('#modal-titulo').textContent.startsWith('Editar'))e.style.display=t==='emprestimo'?'block':'none';$('#k-cons').style.display=t==='consorcio'?'block':'none';}
function syncEntradaContrato(k,lancar){
  let l=k.lancDownId&&D.lancamentos.find(x=>x.id===k.lancDownId);
  if(lancar&&k.valorEntrada>0){
    if(!l){l={id:uid(),origem:'contrato',refId:k.id,forma:'Transferência',obs:''};D.lancamentos.push(l);k.lancDownId=l.id;}
    const t=TIPOS_CONTRATO[k.tipo].toLowerCase();
    Object.assign(l,{tipo:'saida',data:k.dataEntrada||hoje(),valor:k.valorEntrada,categoriaId:catPorNome('Entrada de '+t,'saida'),descricao:`Entrada ${t}: ${k.descricao}${k.instituicao?' ('+k.instituicao+')':''}`,centroId:k.centroId||''});
  }else if(l){D.lancamentos=D.lancamentos.filter(x=>x.id!==l.id);k.lancDownId=null;}
}
const descParcela=(c,p)=>`${TIPOS_CONTRATO[c.tipo]} ${c.descricao}${c.instituicao?' ('+c.instituicao+')':''}, parcela ${p.n}/${c.parcelas.length}`;
function modalBaixa(cid,n){
  const c=D.contratos.find(x=>x.id===cid);const p=c&&c.parcelas.find(x=>x.n===n);if(!p||p.pago)return;
  abrirModal('Dar baixa na parcela',`<p><strong>${esc(c.descricao)}</strong><br>Parcela ${p.n}/${c.parcelas.length}, vencimento ${dBR(p.venc)}, valor ${brl(p.valor)}</p>
  <div class="campos"><label>Data do pagamento<input type="date" id="b-data" value="${hoje()}"></label><label>Valor pago (R$)<input id="b-valor" inputmode="decimal" value="${num(p.valor)}"></label>
  <label class="inteiro">Forma<select id="b-forma">${opcoes(FORMAS,'Boleto')}</select></label></div>
  <p class="dica">Se pagou com juros, multa ou desconto, ajuste o valor pago. A saída vai direto para o caixa.</p>`,()=>{
    const v=parseValor(val('b-valor'));if(v<=0){toast('Informe o valor pago.','erro');return false;}
    const l={id:uid(),origem:'parcela',refId:c.id,tipo:'saida',data:val('b-data')||hoje(),valor:v,categoriaId:catPorNome(CAT_PARCELA[c.tipo],'saida'),descricao:descParcela(c,p),forma:val('b-forma'),centroId:c.centroId||'',obs:''};
    D.lancamentos.push(l);Object.assign(p,{pago:true,anterior:false,dataPag:l.data,valorPago:v,lancId:l.id});
    salvar();render();toast(`Parcela ${p.n} baixada e lançada no caixa.`);
  },'Confirmar baixa');
}
function estornarParcela(cid,n){
  const c=D.contratos.find(x=>x.id===cid);const p=c&&c.parcelas.find(x=>x.n===n);if(!p)return;
  if(!confirm(`Estornar a parcela ${n}?${p.lancId?' A saída no caixa também será excluída.':''}`))return;
  if(p.lancId)D.lancamentos=D.lancamentos.filter(x=>x.id!==p.lancId);
  Object.assign(p,{pago:false,anterior:false,dataPag:'',valorPago:0,lancId:null});salvar();render();toast('Parcela estornada.');
}
function modalValorParcela(cid,n){
  const c=D.contratos.find(x=>x.id===cid);const p=c&&c.parcelas.find(x=>x.n===n);if(!p)return;
  abrirModal(`Alterar parcela ${n}`,`<div class="campos"><label>Novo valor (R$)<input id="vp-valor" inputmode="decimal" value="${num(p.valor)}"></label><label>Vencimento<input type="date" id="vp-venc" value="${p.venc}"></label>
  <label class="inteiro check"><input type="checkbox" id="vp-todas"> Aplicar o novo valor a todas as parcelas em aberto a partir desta</label></div><p class="dica">Útil em consórcio com reajuste ou financiamento com parcela variável.</p>`,()=>{
    const v=parseValor(val('vp-valor'));if(v<=0){toast('Informe um valor válido.','erro');return false;}
    if(chk('vp-todas'))c.parcelas.filter(x=>!x.pago&&x.n>=n).forEach(x=>x.valor=v);else p.valor=v;
    p.venc=val('vp-venc')||p.venc;salvar();render();toast('Parcela alterada.');
  });
}
function excluirContrato(id){
  const c=D.contratos.find(x=>x.id===id);if(!c)return;
  const lancs=c.parcelas.filter(p=>p.lancId).map(p=>p.lancId).concat(c.lancEntradaId?[c.lancEntradaId]:[],c.lancDownId?[c.lancDownId]:[]);
  if(!confirm(`Excluir o contrato "${c.descricao}" e todas as suas parcelas?`))return;
  if(lancs.length&&confirm(`Este contrato tem ${lancs.length} lançamento(s) no caixa (parcelas pagas ou valor recebido).\n\nOK: excluir também esses lançamentos do caixa.\nCancelar: manter os lançamentos no caixa como lançamentos comuns.`)){
    D.lancamentos=D.lancamentos.filter(l=>!lancs.includes(l.id));
  }else D.lancamentos.forEach(l=>{if(lancs.includes(l.id)){l.origem='manual';delete l.refId;}});
  D.contratos=D.contratos.filter(x=>x.id!==id);contratoAberto=null;salvar();render();toast('Contrato excluído.');
}

/* ================== RELATÓRIOS ================== */
const RELS={categorias:'Entradas e saídas por categoria',mensal:'Resultado mês a mês',centros:'Gastos por obra / máquina',extrato:'Extrato do caixa com saldo',compras:'Compras por fornecedor (nota x recibo)',parcelas:'Parcelas por vencimento'};
function montarRel(){
  const {tipo,de,ate}=FR;const noP=x=>x>=de&&x<=ate;
  const L=D.lancamentos.filter(l=>noP(l.data));
  if(tipo==='categorias'){
    const linhas=[];['entrada','saida'].forEach(t=>agrupar(L.filter(l=>l.tipo===t),l=>catNome(l.categoriaId)).forEach(([k,v])=>linhas.push([t==='entrada'?'Entrada':'Saída',k,t==='entrada'?v:-v])));
    const te=soma(L.filter(l=>l.tipo==='entrada')),ts=soma(L.filter(l=>l.tipo==='saida'));
    const ag=agrupar(L.filter(l=>l.tipo==='saida'),l=>catNome(l.categoriaId));
    return {cols:['Tipo','Categoria','Valor'],num:[2],linhas,total:['','Resultado',te-ts],graf:ag.length?{type:'bar',data:{labels:ag.map(a=>a[0]),datasets:[{label:'Saídas',data:ag.map(a=>a[1]),backgroundColor:'#E2601A'}]},options:{indexAxis:'y',scales:{x:eixoBRL}}}:null};
  }
  if(tipo==='mensal'){
    const ms=mesesEntre(de,ate);let saldo=saldoAte(addDias(de,-1));
    const linhas=ms.map(k=>{const e=soma(L.filter(l=>l.tipo==='entrada'&&l.data.startsWith(k))),s=soma(L.filter(l=>l.tipo==='saida'&&l.data.startsWith(k)));saldo=r2(saldo+e-s);return [mesNome(k),e,s,e-s,saldo];});
    return {cols:['Mês','Entradas','Saídas','Resultado','Saldo acumulado'],num:[1,2,3,4],linhas,total:['Total',soma(linhas.map(x=>({valor:x[1]}))),soma(linhas.map(x=>({valor:x[2]}))),soma(linhas.map(x=>({valor:x[3]}))),''],
      graf:{type:'bar',data:{labels:linhas.map(x=>x[0]),datasets:[{label:'Entradas',data:linhas.map(x=>x[1]),backgroundColor:'#1E7F46'},{label:'Saídas',data:linhas.map(x=>x[2]),backgroundColor:'#E2601A'},{type:'line',label:'Saldo',data:linhas.map(x=>x[4]),borderColor:'#25272b',backgroundColor:'#25272b'}]},options:{scales:{y:eixoBRL}}}};
  }
  if(tipo==='centros'){
    const S=L.filter(l=>l.tipo==='saida'),E=L.filter(l=>l.tipo==='entrada');
    const nomes=[...new Set(L.map(l=>centroNome(l.centroId)||'Sem obra / máquina'))];
    const linhas=nomes.map(n=>{const f=l=>(centroNome(l.centroId)||'Sem obra / máquina')===n;const e=soma(E.filter(f)),s=soma(S.filter(f));return [n,e,s,e-s];}).sort((a,b)=>b[2]-a[2]);
    return {cols:['Obra / máquina','Entradas','Saídas','Resultado'],num:[1,2,3],linhas,total:['Total',soma(E),soma(S),soma(E)-soma(S)],graf:linhas.length?{type:'bar',data:{labels:linhas.map(x=>x[0]),datasets:[{label:'Entradas',data:linhas.map(x=>x[1]),backgroundColor:'#1E7F46'},{label:'Saídas',data:linhas.map(x=>x[2]),backgroundColor:'#E2601A'}]},options:{scales:{y:eixoBRL}}}:null};
  }
  if(tipo==='extrato'){
    let s=saldoAte(addDias(de,-1));const ord=[...L].sort((a,b)=>a.data.localeCompare(b.data));
    const linhas=[[dBR(addDias(de,-1)),'Saldo anterior','','',s]].concat(ord.map(l=>{const v=l.tipo==='entrada'?l.valor:-l.valor;s=r2(s+v);return [dBR(l.data),l.descricao,catNome(l.categoriaId),v,s];}));
    return {cols:['Data','Descrição','Categoria','Valor','Saldo'],num:[3,4],linhas,total:['','Saldo final','','',s],graf:null};
  }
  if(tipo==='compras'){
    const C=D.compras.filter(c=>noP(c.data));const fs=[...new Set(C.map(c=>c.fornecedor))];
    const linhas=fs.map(f=>{const n=soma(C.filter(c=>c.fornecedor===f&&c.doc==='nota')),r=soma(C.filter(c=>c.fornecedor===f&&c.doc==='recibo'));return [f,n,r,n+r];}).sort((a,b)=>b[3]-a[3]);
    const tn=soma(C.filter(c=>c.doc==='nota')),tr=soma(C.filter(c=>c.doc==='recibo'));
    return {cols:['Fornecedor','Com nota','Com recibo','Total'],num:[1,2,3],linhas,total:['Total',tn,tr,tn+tr],graf:tn+tr?{type:'doughnut',data:{labels:['Nota fiscal','Recibo'],datasets:[{data:[tn,tr],backgroundColor:['#25272b','#F2B200']}]}}:null};
  }
  if(tipo==='parcelas'){
    const P=todasParcelas().filter(x=>noP(x.p.venc)).sort((a,b)=>a.p.venc.localeCompare(b.p.venc));
    const linhas=P.map(({c,p})=>[dBR(p.venc),`${TIPOS_CONTRATO[c.tipo]}: ${c.descricao}`,`${p.n}/${c.parcelas.length}`,p.pago?'Paga':(p.venc<hoje()?'Vencida':'Em aberto'),p.valor]);
    return {cols:['Vencimento','Contrato','Parcela','Situação','Valor'],num:[4],linhas,total:['','Total','','',soma(P.map(x=>x.p))],graf:null};
  }
}

function top10Html(){

function baixarCSV(nome,cols,linhas){
  const f=v=>typeof v==='number'?num(v).replace(/\./g,''):`"${String(v??'').replace(/"/g,'""')}"`;
  const txt='\ufeff'+[cols.map(f).join(';')].concat(linhas.map(l=>l.map(f).join(';'))).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download=nome;document.body.appendChild(a);a.click();a.remove();
}

function contarDados(d){return d?['lancamentos','compras','receber','contratos','orcamentos'].reduce((n,k)=>n+((d[k]||[]).length),0):0;}
function resumoDados(d){return `${(d.lancamentos||[]).length} lançamento(s) no caixa, ${(d.compras||[]).length} compra(s)/conta(s) a pagar, ${(d.receber||[]).length} conta(s) a receber, ${(d.contratos||[]).length} contrato(s) e ${(d.orcamentos||[]).length} orçamento(s)`;}
function usarDadosNuvem(dados){D=dados;normalizar();localStorage.setItem(CHAVE,JSON.stringify(D));setStatus('online');render();}
async function salvarSupabase(){
  const url=val('cf-url').replace(/\/+$/,''),chave=val('cf-chave');
  if(!url||!chave){toast('Informe a URL e a chave.','erro');return;}
  const cfgAntiga=CFG;CFG={url,chave};
  let j;
  try{
    const r=await fetch(`${url}/rest/v1/dados_app?id=eq.${REG_ID}&select=dados,atualizado_em`,{headers:hdr()});
    if(!r.ok)throw new Error('HTTP '+r.status);
    j=await r.json();
  }catch(e){CFG=cfgAntiga;setStatus(online()?'erro':'local');toast('Não conectou. Confira a URL, a chave e se a tabela dados_app foi criada.','erro');return;}
  const gravarCfg=()=>{CFG={url,chave};localStorage.setItem(CHAVE_CFG,JSON.stringify(CFG));};
  const nuvem=j[0]&&j[0].dados,qNuvem=contarDados(nuvem),qLocal=contarDados(D);
  // nuvem vazia: envia o que tem aqui
  if(!qNuvem){gravarCfg();await enviar();toast('Conectado. Os dados deste aparelho foram enviados para a nuvem.');render();return;}
  // aparelho vazio: usa a nuvem direto, sem perguntar
  if(!qLocal){gravarCfg();usarDadosNuvem(nuvem);toast('Conectado. Dados da nuvem carregados neste aparelho.');return;}
  // os dois têm dados: só grava a conexão depois da escolha
  CFG=cfgAntiga;
  abrirModal('Já existem dados na nuvem',`
    <p><strong>Na nuvem:</strong> ${resumoDados(nuvem)}.${j[0].atualizado_em?` Última gravação em ${new Date(j[0].atualizado_em).toLocaleString('pt-BR')}.`:''}</p>
    <p><strong>Neste aparelho:</strong> ${resumoDados(D)}.</p>
    <div class="campos">
      <label class="inteiro check"><input type="radio" name="sync" value="nuvem" checked onchange="$('#sync-conf').style.display='none'"> <span><strong>Usar os dados da nuvem</strong> (recomendado). Este aparelho passa a mostrar o que já está salvo online.</span></label>
      <label class="inteiro check"><input type="radio" name="sync" value="aparelho" onchange="$('#sync-conf').style.display='block'"> <span><strong>Substituir a nuvem pelos dados deste aparelho.</strong> Tudo o que está na nuvem será apagado.</span></label>
      <div id="sync-conf" class="inteiro" style="display:none"><div class="alerta" style="margin:4px 0 8px">Os dados da nuvem serão perdidos e todos os outros aparelhos passarão a mostrar os dados deste. Baixe um backup antes, se tiver dúvida.</div>
        <label>Para confirmar, digite SUBSTITUIR<input id="sync-txt" autocomplete="off"></label></div>
    </div>`,()=>{
      if(document.querySelector('input[name=sync]:checked').value==='nuvem'){gravarCfg();usarDadosNuvem(nuvem);toast('Dados da nuvem carregados neste aparelho.');return;}
      if(val('sync-txt').toUpperCase()!=='SUBSTITUIR'){toast('Digite SUBSTITUIR para confirmar, ou escolha usar os dados da nuvem.','erro');return false;}
      gravarCfg();enviar().then(()=>{toast('A nuvem foi substituída pelos dados deste aparelho.');render();});
    },'Continuar');
}
async function enviarAgora(){
  if(!online()){toast('Configure o Supabase primeiro.','erro');return;}
  if(prompt(`Isto apaga os dados da nuvem e coloca no lugar os dados deste aparelho (${resumoDados(D)}).\n\nPara confirmar, digite SUBSTITUIR`)?.toUpperCase()!=='SUBSTITUIR'){toast('Envio cancelado.');return;}
  await enviar();toast('Dados enviados para a nuvem.');
}
function desconectar(){if(!confirm('Desconectar do Supabase? Os dados continuam salvos neste aparelho.'))return;CFG={};localStorage.removeItem(CHAVE_CFG);setStatus('local');render();}
function baixarBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download=`backup_bom_jesus_financeiro_${hoje()}.json`;document.body.appendChild(a);a.click();a.remove();}
function restaurarBackup(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.lancamentos||!d.categorias)throw 0;if(!confirm('Substituir todos os dados atuais por este backup?'))return;D=d;normalizar();salvar();render();toast('Backup restaurado.');}catch(e){toast('Arquivo de backup inválido.','erro');}};
  r.readAsText(f);
}
function apagarTudo(){
  if(!confirm('Apagar TODOS os lançamentos, compras e contratos?'))return;
  if(prompt('Para confirmar, digite APAGAR')!=='APAGAR')return;
  D=base();salvar();render();toast('Dados apagados.');
}
